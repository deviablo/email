[package]
name = "e-mail"
description = "A simple, modern e-mail app for Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
anyhow.workspace = true
futures.workspace = true
async-channel.workspace = true
chrono.workspace = true
e-mail-core = { path = "../core" }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
oo7 = { version = "0.7", default-features = false, features = ["tokio", "native_crypto"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webkit = { package = "webkit6", version = "0.6" }
ashpd = { version = "0.14", default-features = false, features = ["tokio", "background"] }
