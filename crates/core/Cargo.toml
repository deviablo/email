[package]
name = "e-mail-core"
description = "Mail logic for E-Mail: IMAP sync, local storage and HTML sanitising"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
ammonia = "4"
anyhow.workspace = true
async-channel.workspace = true
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
thiserror = "2"
chrono.workspace = true
futures.workspace = true
mail-parser = "0.11"
rusqlite = { version = "0.43", features = ["bundled"] }
rustls-native-certs = "0.8"
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tracing.workspace = true
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "tokio1-rustls", "ring", "rustls-native-certs"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
roxmltree = "0.21"
mail-builder = { version = "0.4.4", default-features = false }

