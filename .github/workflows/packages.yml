# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds the packages: .deb (Ubuntu, Debian, Mint), .rpm (Fedora, openSUSE)
# and the Flatpak bundle. Each package is installed and started once.
# Pull requests keep the packages as downloadable artifacts for testing;
# a tag like v1.0.0 attaches them to a GitHub release.

name: Packages

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    name: .deb (Ubuntu, Debian, Mint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev \
            meson ninja-build gettext desktop-file-utils appstream \
            libglib2.0-dev-bin dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build package
        run: build-aux/package-deb.sh dist
      - name: Install and start
        run: |
          sudo apt-get install -y ./dist/*.deb xvfb dbus-daemon apparmor-utils
          sudo aa-status | grep io.github.digistalter.EMail
          test -f /usr/share/glib-2.0/schemas/gschemas.compiled
          test -f /usr/share/locale/de/LC_MESSAGES/e-mail.mo
          appstreamcli validate --no-net /usr/share/metainfo/io.github.digistalter.EMail.metainfo.xml
          build-aux/smoke-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: e-mail-deb
          path: dist/*.deb

  rpm:
    name: .rpm (Fedora, openSUSE)
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install build packages
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc cargo rust rpm-build \
            gtk4-devel libadwaita-devel webkitgtk6.0-devel \
            meson ninja-build gettext desktop-file-utils appstream glib2-devel
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build package
        run: build-aux/package-rpm.sh dist
      - name: Install and start
        run: |
          dnf install -y ./dist/*.rpm xorg-x11-server-Xvfb dbus-daemon
          test -f /usr/share/locale/de/LC_MESSAGES/e-mail.mo
          glib-compile-schemas /usr/share/glib-2.0/schemas
          build-aux/smoke-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: e-mail-rpm
          path: dist/*.rpm

  flatpak:
    name: Flatpak
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      # See ci.yml: updating the preinstalled runtimes needs a writable copy.
      - name: Make preinstalled runtimes updatable
        run: |
          cp -a /var/lib/flatpak /var/lib/flatpak.writable
          rm -rf /var/lib/flatpak
          mv /var/lib/flatpak.writable /var/lib/flatpak
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: e-mail.flatpak
          manifest-path: build-aux/flatpak/io.github.digistalter.EMail.json
          cache-key: flatpak-packages-${{ github.sha }}

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.flatpak' \) \
            -exec cp {} . \;
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "E-Mail ${TAG#v}" \
            --notes "Installation: see the README." ./*.deb ./*.rpm ./*.flatpak
